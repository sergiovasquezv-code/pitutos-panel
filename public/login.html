<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · Pitutos Panel</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="logo">PI</div>
      <h1 id="titulo">Pitutos Panel</h1>
      <p class="sub">Ingresa para administrar tus clientes, equipos y servicios.</p>

      <div id="flash-area"></div>

      <form id="login-form">
        <div class="field">
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username" required autofocus>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-accent" style="width:100%; justify-content:center; margin-top:6px;">Ingresar</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { apiPost, apiGet } from "/js/api.js";

    const flashArea = document.getElementById("flash-area");
    function flash(msg, type = "error") {
      flashArea.innerHTML = `<div class="flash ${type}">${msg}</div>`;
    }

    // Si ya hay sesión (o falta configurar), redirige.
    apiGet("/api/me").then((data) => {
      if (data.needsSetup) {
        window.location.href = "/setup.html";
      } else if (data.authenticated) {
        window.location.href = "/index.html";
      }
    }).catch(() => {});

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      try {
        await apiPost("/api/auth/login", { username, password });
        window.location.href = "/index.html";
      } catch (err) {
        flash(err.message || "No se pudo iniciar sesión.");
      }
    });
  </script>
</body>
</html>
